run_id: robocasa_qwenoft_gr1_100k
run_root_dir: /root/tianyi/starVLA/playground/Checkpoints/robocasa
seed: 42
trackers:
- jsonl
- wandb
wandb_entity: mehdizhang2-tsinghua-university
wandb_project: WAM
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /root/tianyi/starVLA/playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: MLP
    action_dim: 29
    state_dim: 58
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /root/tianyi/LDA-1B/playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1000_rollout_fdm
    action_type: delta_ee
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs:
    - image_0
    image_size:
    - 224
    - 224
    obs_image_size:
    - 224
    - 224
    policy_image_history: 1
    include_state: true
    delete_pause_frame: false
    training_task_weights:
    - 1
    - 1
    - 1
    - 1
    return_vlm_inputs: false
    use_delta_action: false
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  pretrained_checkpoint: null
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  enable_mixed_precision_training: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
